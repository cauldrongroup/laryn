name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to build, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

env:
  LARYN_UPDATE_BASE_URL: ${{ vars.LARYN_UPDATE_BASE_URL }}
  LARYN_R2_BUCKET: ${{ vars.LARYN_R2_BUCKET }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version must be semver, received '$version'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate update name
        id: release_name
        shell: pwsh
        run: |
          $adjectives = @(
            "brisk", "calm", "clear", "clever", "cozy", "dapper", "fuzzy", "gentle",
            "glossy", "golden", "happy", "kind", "lively", "lucky", "merry", "nimble",
            "polished", "quick", "quiet", "radiant", "snappy", "steady", "sunny", "tidy"
          )
          $objects = @(
            "anchor", "atlas", "badge", "beacon", "button", "cactus", "camera", "comet",
            "compass", "crane", "dolphin", "falcon", "fern", "lantern", "maple", "otter",
            "pencil", "rocket", "saffron", "sparrow", "teacup", "violet", "wallet", "window"
          )

          $adjective = $adjectives | Get-Random
          $object = $objects | Get-Random
          $name = "$adjective-$object"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Stamp desktop package version
        shell: pwsh
        run: |
          $packagePath = "apps/desktop/package.json"
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package.version = "${{ steps.version.outputs.version }}"
          $package | Add-Member -NotePropertyName releaseName -NotePropertyValue "${{ steps.release_name.outputs.name }}" -Force
          $package | ConvertTo-Json -Depth 20 | Set-Content $packagePath

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer and update metadata
        run: pnpm desktop:dist:win

      - name: Verify release files
        shell: pwsh
        run: |
          $releaseDir = "apps/desktop/release"
          $required = @(
            "$releaseDir/latest.yml",
            "$releaseDir/Laryn-${{ steps.version.outputs.version }}-win-x64.exe",
            "$releaseDir/Laryn-${{ steps.version.outputs.version }}-win-x64.exe.blockmap"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Get-ChildItem $releaseDir
              throw "Missing release file: $file"
            }
          }

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Laryn ${{ steps.version.outputs.version }} (${{ steps.release_name.outputs.name }})
          files: |
            apps/desktop/release/latest.yml
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap

      - name: Publish update feed to R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if (-not $env:LARYN_UPDATE_BASE_URL) {
            throw "Set repository variable LARYN_UPDATE_BASE_URL to the public R2 URL used by the updater."
          }
          if (-not $env:LARYN_R2_BUCKET) {
            throw "Set repository variable LARYN_R2_BUCKET to the R2 bucket name."
          }
          if (-not $env:CLOUDFLARE_ACCOUNT_ID) {
            throw "Set repository variable CLOUDFLARE_ACCOUNT_ID to the Cloudflare account id."
          }
          if (-not $env:AWS_ACCESS_KEY_ID) {
            throw "Set repository secret R2_ACCESS_KEY_ID to the R2 access key id."
          }
          if (-not $env:AWS_SECRET_ACCESS_KEY) {
            throw "Set repository secret R2_SECRET_ACCESS_KEY to the R2 secret access key."
          }

          $releaseDir = "apps/desktop/release"
          $endpoint = "https://$env:CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          $files = Get-ChildItem $releaseDir -File | Where-Object {
            $_.Name -eq "latest.yml" -or $_.Name -like "*.exe" -or $_.Name -like "*.blockmap"
          }

          foreach ($file in $files) {
            $contentType = if ($file.Name -eq "latest.yml") { "text/yaml" } else { "application/octet-stream" }
            $cacheControl = if ($file.Name -eq "latest.yml") { "no-cache" } else { "public, max-age=31536000, immutable" }
            aws s3 cp "$($file.FullName)" "s3://$env:LARYN_R2_BUCKET/$($file.Name)" --endpoint-url $endpoint --content-type $contentType --cache-control $cacheControl
          }

          aws s3 cp "s3://$env:LARYN_R2_BUCKET/latest.yml" "$env:RUNNER_TEMP/latest.yml" --endpoint-url $endpoint

          $publicLatestUrl = "$($env:LARYN_UPDATE_BASE_URL.TrimEnd('/'))/latest.yml"
          $latestResponse = Invoke-WebRequest -Uri $publicLatestUrl -UseBasicParsing
          if ($latestResponse.StatusCode -ne 200) {
            throw "Public update feed is not reachable: $publicLatestUrl"
          }
